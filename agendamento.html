<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h2>🏐 GameMatch</h2>
</header>

<div class="agendamento">

  <!-- LADO ESQUERDO -->
  <div class="quadra-info">
    <img src="imagens/quadra1.jpg">

    <h2>Quadra Central</h2>
    <p>Futebol</p>

    <h3 class="preco">R$ 150 <span>/ hora</span></h3>

    <p>📍 Centro - Anápolis</p>
    <p>👥 Capacidade: 14 jogadores</p>

    <div class="comodidades">
      <span>Iluminação</span>
      <span>Vestiário</span>
    </div>
  </div>

  <!-- LADO DIREITO -->
  <div class="reserva">

    <h3>Agendar Horário</h3>

    <!-- CALENDÁRIO SIMPLES -->
    <input type="date" id="data">

    <h4>Selecione o Horário</h4>

    <div class="horarios">
      <button onclick="selecionarHora(this)">08:00</button>
      <button onclick="selecionarHora(this)">09:00</button>
      <button onclick="selecionarHora(this)">10:00</button>
    </div>

    <button class="confirmar" onclick="confirmar()">Confirmar Reserva</button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
